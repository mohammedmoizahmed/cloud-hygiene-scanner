name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg APP_COMMIT=${{ github.sha }} --build-arg APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) -t cloud-hygiene-scanner:ci .
      - name: Start it and check it is healthy
        run: |
          docker run -d --name scanner -p 5000:5000 -e SECRET_KEY=ci-secret -e SCANNER_PASSWORD=ci-password cloud-hygiene-scanner:ci
          for i in $(seq 1 15); do curl -sf localhost:5000/health && break || sleep 2; done
          curl -sf localhost:5000/health
          curl -s localhost:5000/version
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:5000/)" = "401"
